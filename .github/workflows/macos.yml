# The pipeline on an Apple Silicon Mac, the one platform nothing local can run.
# Everything else runs on the build machines through cicd/cicd.bash.
# cicd.bash starts this on a full run, --backlog-run-full and --merge-gate,
# which take about as long, and not on a quick run. The pre-push hook's
# merge gate runs before main has the commit, so main gets it on the push.
name: macos

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "project/**", "assets/**"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  arm64:
    # macos-15 is the free arm64 runner closest to the release's macOS 13.0 floor.
    runs-on: macos-15
    timeout-minutes: 60
    env:
      ZIG_VER: 0.17.0
      ZIG_SHA256: b607e9b9234790a008116ae5bdb71c6243b84b9fb42a53a9e70fde41c06c536a
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The image's bash is Apple's 3.2.
      - name: bash 5
        run: |
          brew install bash
          echo "$(brew --prefix)/bin" >> "${GITHUB_PATH}"

      # The image has Go, but not on PATH. setup-go sets GOTOOLCHAIN=local, and
      # a release's reactor has to come from the Dockerfile's GO_VER, so that one.
      - id: pins
        run: echo "go=$(sed -n 's/^ARG GO_VER=//p' cicd/container/Dockerfile)" >> "${GITHUB_OUTPUT}"

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ steps.pins.outputs.go }}
          cache-dependency-path: go/go.sum

      # Where cicd.bash looks for it, so nothing has to name it.
      - id: zig-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.local/zig-aarch64-macos-${{ env.ZIG_VER }}
          key: zig-aarch64-macos-${{ env.ZIG_VER }}-${{ env.ZIG_SHA256 }}

      - name: zig
        if: steps.zig-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSLo "${RUNNER_TEMP}/zig.txz" "https://ziglang.org/download/${ZIG_VER}/zig-aarch64-macos-${ZIG_VER}.tar.xz"
          echo "${ZIG_SHA256}  ${RUNNER_TEMP}/zig.txz" | shasum -a 256 -c -
          mkdir -p ~/.local/zig-aarch64-macos-"${ZIG_VER}"
          tar -C ~/.local/zig-aarch64-macos-"${ZIG_VER}" --strip-components=1 -xJf "${RUNNER_TEMP}/zig.txz"

      # The full run, less what needs docker, which skips by itself. --package
      # builds the universal release, and runs both slices of it. The demo is
      # rendered with the build box's fonts, and --no-remote keeps this run
      # from starting another.
      - name: pipeline
        run: |
          bash --version | head -n 1
          bash cicd/cicd.bash -q --package --no-sync --no-backup --no-dogfood --no-demo --no-remote < /dev/null

      - name: release command
        run: bash cicd/utility/cli-test.bash --bin "$(ls dist/zuid-*-darwin-universal)"

      - name: logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: cicd-logs
          path: cicd/artifacts/lint/*.log
          retention-days: 7
