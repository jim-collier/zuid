# Demo scenario for gen-demo-gif.py. Each [[step]] types its show= line into the
# fake terminal, runs run= (default: show) for real, and shows the output. {prog}
# renders as the program name and {bin} runs as the tested binary path. pause= is
# the read time in seconds, notepause= the read time after the comment line, and
# clear= forces a blank screen - otherwise the screen only resets when the next
# step would not fit, so the demo scrolls as little as it clears.
#
# Keep the whole thing under about forty-five seconds. It loops, so anyone
# wanting a second look gets one for free. Typing pace stays at a human rate on
# purpose, which means the way to shorten this is fewer words, not faster typing.
#
# Flags are written --flag=value rather than -f value. Costs a few characters of
# typing time and makes it obvious both what the flag means and which value
# belongs to it, which is the whole point of a ten-second look. Quotes go on only
# where the value carries a symbol the shell would otherwise take ('-', '%'), so
# the ones that are there look deliberate.

title = "zuid"
prog  = "zuid"
seed  = 62
font  = ["Monaspace Argon SemiBold"]
end_hold    = 3.5
end_black   = 5.0
clear_pause = 1.7

[[step]]
note  = "Short, sortable, unique IDs"
show  = "{prog}"
notepause = 0.45
pause = 1.9

[[step]]
note  = "Username (hashed)"
show  = "{prog} --format='%u'"
notepause = 0.45
pause = 2.1

[[step]]
# Last thing on screen before the clear, so it holds noticeably longer.
note  = "Random"
show  = "{prog} --format='%r'"
notepause = 0.45
pause = 3.2

[[step]]
note  = "Minute precision, base 32 Crockford"
show  = "{prog} --precision='-1' --base=32c"
clear = true
notepause = 0.45
pause = 2.0

[[step]]
note  = "Millisecond, 256tt"
show  = "{prog} --precision=1 --base=256tt"
notepause = 0.45
pause = 2.0
